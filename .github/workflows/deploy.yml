name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm ci

      - name: Добавить .env.production
        run: echo "${{ secrets.ENV_CLIENT_PRODUCTION }}" > .env.production

      - name: Собрать проект
        run: npm run build

      - name: Упаковать билд
        run: |
          mkdir -p deploy
          cp -r .next public package.json .env.production next.config.mjs deploy/
          tar -czf deploy.tar.gz -C deploy .
          ls -lh deploy.tar.gz

      - name: Передать билд на сервер
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy.tar.gz

      - name: Распаковать и перезапустить PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e
          cd /opt/cargo_front
          rm -rf .next public .env.production next.config.mjs package.json
          tar -xzf /tmp/deploy.tar.gz -C .
          pm2 restart front || pm2 start npm --name front -- start
          EOF
